        - heading "使用 Waline 评论系统" [level=2] [ref=e254]
        - paragraph [ref=e255]:
          - link "Waline" [ref=e256] [cursor=pointer]:
            - /url: https://waline.js.org
          - text: 是一款简洁、安全的评论系统，提供了多种部署方式。在体验了 LeanCloud 和 Vercel 这两种无服务部署方式后，发现速度太慢，最后用 Docker 自建了服务。
        - heading "部署服务端" [level=3] [ref=e257]
        - paragraph [ref=e258]:
          - text: 如果你也想使用 Docker 部署服务端，可以参考我的
          - code [ref=e259]: docker-compose.yaml
          - text: ：
        - group [ref=e260]:
          - generic "点击展开完整配置" [ref=e261]
        - blockquote [ref=e262]:
          - paragraph [ref=e263]:
            - text: 提示：记得将上面的配置中的站点信息、邮箱账号和密码替换成你自己的。
            - code [ref=e264]: JWT_TOKEN
            - text: 使用任意随机字符串即可。
        - paragraph [ref=e265]:
          - text: 然后执行
          - code [ref=e266]: docker-compose up -d
          - text: 启动服务，Waline 会自动创建 SQLite 数据库并监听 8360 端口。
        - paragraph [ref=e267]:
          - strong [ref=e268]: 关于头像服务的选择
        - paragraph [ref=e269]:
          - text: 在
          - code [ref=e270]: GRAVATAR_STR
          - text: 环境变量中，我使用
          - link "Cravatar" [ref=e271] [cursor=pointer]:
            - /url: https://cravatar.com/
          - text: 代替了 Waline 默认的 Libravatar。Libravatar 加载头像时会返回 302 重定向，这个 302 状态码会导致
          - link "后退/前进缓存" [ref=e272] [cursor=pointer]:
            - /url: https://web.developers.google.cn/articles/bfcache?hl=zh-cn
          - text: 失效。Cravatar 是国内镜像服务，访问速度快且直接返回头像，没有重定向问题。
        - heading "集成客户端" [level=3] [ref=e273]
        - paragraph [ref=e274]: 服务端配置完成后，接下来需要在博客中集成 Waline 的前端组件。
