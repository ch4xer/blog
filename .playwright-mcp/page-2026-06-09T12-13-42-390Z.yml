        - heading "添加图片画廊组件" [level=2] [ref=e286]
        - paragraph [ref=e287]:
          - text: PaperMod 主题对图片的支持比较基础，文章中的图片既不能点击放大查看，也不能排列布局。为了优化一下体验，我找到了
          - link "mfg92/hugo-shortcode-gallery" [ref=e288] [cursor=pointer]:
            - /url: https://github.com/mfg92/hugo-shortcode-gallery
          - text: 这个项目，它可以在文章中以画廊形式展示图片，支持响应式布局和点击预览。
        - paragraph [ref=e289]:
          - text: 具体效果可以看
          - link "去长鹿旅游休博园" [ref=e290] [cursor=pointer]:
            - /url: /posts/2025/06/30/chuanloo/
          - text: 这篇文章。
        - list [ref=e291]:
          - listitem [ref=e292]: 我使用 Git 子模块的方式安装（与主题的安装方式一致），在项目根目录中执行：
        - code [ref=e295]:
          - generic [ref=e297]: git submodule add https://github.com/mfg92/hugo-shortcode-gallery.git themes/hugo-shortcode-gallery
        - list [ref=e298]:
          - listitem [ref=e299]:
            - text: 在
            - code [ref=e300]: config.yaml
            - text: 中将该组件添加到
            - code [ref=e301]: theme
            - text: 字段：
        - code [ref=e304]:
          - generic [ref=e306]: "theme: [PaperMod, hugo-shortcode-gallery]"
        - list [ref=e307]:
          - listitem [ref=e308]:
            - text: 在文章中使用
            - code [ref=e309]: gallery
            - text: 加载图片：
        - code [ref=e312]:
          - generic [ref=e314]: "{{< gallery match=\"images/*\" sortOrder=\"asc\" rowHeight=\"150\" margins=\"5\" thumbnailResizeOptions=\"600x600 q90 Lanczos\" previewType=\"blur\" embedPreview=true loadJQuery=true >}}"
        - paragraph [ref=e315]: 参数说明：
        - list [ref=e316]:
          - listitem [ref=e317]:
            - code [ref=e318]: match
            - text: ": 图片路径匹配规则"
          - listitem [ref=e319]:
            - code [ref=e320]: rowHeight
            - text: ": 缩略图行高"
          - listitem [ref=e321]:
            - code [ref=e322]: margins
            - text: ": 图片间距"
          - listitem [ref=e323]:
            - code [ref=e324]: thumbnailResizeOptions
            - text: ": 缩略图生成选项"
          - listitem [ref=e325]:
            - code [ref=e326]: previewType
            - text: ": 预览效果（blur 为模糊过渡）"
        - paragraph [ref=e327]: 需要注意的是，这个组件支持展示图片的 Exif 信息（默认关闭）。如果启用该功能，构建时会扫描所有图片并提取元数据，构建时间会随图片数量和大小显著增加。如果你的图片比较多，建议关闭以提升构建速度。
