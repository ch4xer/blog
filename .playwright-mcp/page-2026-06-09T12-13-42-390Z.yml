          - text: 的性能检测做了优化，使用
          - code [ref=e281]: IntersectionObserver
          - text: 实现懒加载，只有当滚动到评论区附近时才动态加载 CSS 和 JS 资源，不影响首屏渲染。
        - paragraph [ref=e282]:
