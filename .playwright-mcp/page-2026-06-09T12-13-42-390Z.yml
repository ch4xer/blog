        - heading "字体本地化" [level=2] [ref=e162]
        - paragraph [ref=e163]: 上面使用了 Inter 字体来优化阅读体验，但直接使用 Google Fonts 在国内访问会遇到加载缓慢甚至超时的问题，导致字体加载失败或页面渲染阻塞。因此需要将字体文件下载到本地托管，既能提升访问速度，也能保护用户隐私。
        - list [ref=e164]:
          - listitem [ref=e165]:
            - text: 创建
            - code [ref=e166]: download-fonts.py
            - text: 脚本，自动下载字体并生成本地 CSS：
        - group [ref=e167]:
          - generic "点击展开完整代码" [ref=e168]
        - list [ref=e169]:
          - listitem [ref=e170]: 运行脚本
        - code [ref=e173]:
          - generic [ref=e175]: "# 1. 安装依赖"
          - generic [ref=e177]: pip install requests
          - generic [ref=e181]: "# 2. 运行脚本"
          - generic [ref=e183]: python3 download-fonts.py
        - paragraph [ref=e184]: 脚本会自动：
        - list [ref=e185]:
          - listitem [ref=e186]:
            - text: 下载字体文件到
            - code [ref=e187]: static/fonts/
            - text: 目录
          - listitem [ref=e188]:
            - text: 生成本地 CSS 到
            - code [ref=e189]: assets/css/extended/fonts.css
          - listitem [ref=e190]:
            - text: Hugo 会自动加载
            - code [ref=e191]: extended
            - text: 目录中的 CSS
        - list [ref=e192]:
          - listitem [ref=e193]:
            - text: 更新
            - code [ref=e194]: layouts/partials/extend_head.html
            - text: ，移除 Google Fonts 的引用，改用本地字体预加载：
        - code [ref=e197]:
          - generic [ref=e199]: "- <!-- Inter 字体引入 -->"
          - generic [ref=e201]: "- <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">"
          - generic [ref=e203]: "- <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>"
          - generic [ref=e205]: "- <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap\" rel=\"stylesheet\">"
          - generic [ref=e207]: + <!-- 预加载关键字体文件，提升首屏渲染速度 -->
          - generic [ref=e209]: + <link rel="preload" href="/fonts/inter-7.woff2" as="font" type="font/woff2" crossorigin>
        - paragraph [ref=e210]:
