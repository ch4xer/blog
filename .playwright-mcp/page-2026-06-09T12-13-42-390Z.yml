        - heading "解决图片加载抖动（CLS）问题" [level=2] [ref=e129]
        - paragraph [ref=e130]:
          - text: 使用
          - link "PageSpeed Insights" [ref=e131] [cursor=pointer]:
            - /url: https://pagespeed.web.dev/
          - text: 检测博客时，发现 CLS（Cumulative Layout Shift，累积布局偏移）分数偏高，页面加载时图片会造成明显的抖动现象。
        - paragraph [ref=e132]: CLS 是 Google 评估网站用户体验的重要指标之一，分数过高通常是因为图片加载时浏览器不知道应该预留多大的空间，等图片加载完成后就会把下面的内容挤下去，导致页面跳动。
        - paragraph [ref=e133]: 解决办法就是为图片添加正确的宽高属性，让浏览器在加载前预留空间。
        - paragraph [ref=e134]:
          - text: 创建
          - code [ref=e135]: layouts/_default/_markup/render-image.html
          - text: 文件：
        - group [ref=e136]:
          - generic "点击展开完整代码" [ref=e137]
        - blockquote [ref=e138]:
          - paragraph [ref=e139]:
            - text: 提示：图片需要放在文章同目录（Page Bundle）或
            - code [ref=e140]: assets
            - text: 目录下，否则无法自动获取尺寸。
        - heading "优化阅读体验" [level=2] [ref=e141]
        - paragraph [ref=e142]:
          - text: 对字体、排版、间距等进行了优化，主要借鉴了
          - link "Dvel" [ref=e143] [cursor=pointer]:
            - /url: https://dvel.me/posts/hugo-papermod-config/#markdown-%e6%b8%b2%e6%9f%93%e9%a3%8e%e6%a0%bc
          - text: 和
          - link "atpX" [ref=e144] [cursor=pointer]:
            - /url: https://atpx.com/blog/improving-online-reading-experience/
          - text: 的博客。
        - paragraph [ref=e145]:
          - text: 首先引入 Inter 字体，在
          - code [ref=e146]: layouts/partials/extend_head.html
          - text: 中添加：
        - code [ref=e149]:
