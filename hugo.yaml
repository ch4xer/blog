baseURL: "https://dragonbox.top/"
locale: en-us
hasCJKLanguage: true
pagination:
  pagerSize: 20
title: ch4ser://zone
theme: ["PaperMod"]
publishDir: "public"
params:
  homeInfoParams:
    Title: ch4ser
    ImageUrl: avatar.jpg
    Content: But I don't want comfort. I want God, I want poetry, I want real danger, I want freedom, I want goodness. I want sin.

  socialIcons:
    - name: "Github"
      url: "https://github.com/ch4xer"
    - name: "Mail"
      url: "mailto:ch4xer@gmail.com"
    - name: "RSS"
      url: "index.xml"
  UseHugoToc: true
  showtoc: true
  tocopen: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  busuanzi:
    enable: true
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "favicon-180x180.png"
    safari_pinned_tab: "favicon.ico"
    theme_color: "#2e2e33"
    msapplication_TileColor: "#2e2e33"
    disableFingerprinting: false
  label:
    text: "ch4ser://zone"
    iconHeight: 35

markup:
  highlight:
    noClasses: false
    style: github

menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: friends
      name: friends
      url: /friends/
      weight: 30
    - identifier: about
      name: about
      url: /about/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON
